# Identity for the coordinator Pod (serviceAccountName in coordinator.yml).
# Locally the coordinator uses the k3s admin kubeconfig instead, so this only
# limits it once it runs inside the cluster. Apply after namespaces.yml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coordinator
  namespace: idlecloud-system
---
# Launch and clean up replica Jobs and Pods in idlecloud-jobs only
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: coordinator-jobs
  namespace: idlecloud-jobs
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete", "get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: coordinator-jobs
  namespace: idlecloud-jobs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: coordinator-jobs
subjects:
  - kind: ServiceAccount
    name: coordinator
    namespace: idlecloud-system
---
# Read node Ready, so the Pod watcher can tell EVICTED from LOST, and list the
# workers so GET /capacity can count free room for new task copies
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: coordinator-nodes
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: coordinator-nodes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: coordinator-nodes
subjects:
  - kind: ServiceAccount
    name: coordinator
    namespace: idlecloud-system
---
# Check heartbeat tokens: a TokenReview says which service account and node
# a projected token belongs to
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: coordinator-tokenreview
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: coordinator-tokenreview
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: coordinator-tokenreview
subjects:
  - kind: ServiceAccount
    name: coordinator
    namespace: idlecloud-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: coordinator-leader
  namespace: idlecloud-system
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: coordinator-leader
  namespace: idlecloud-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: coordinator-leader
subjects:
  - kind: ServiceAccount
    name: coordinator
    namespace: idlecloud-system
