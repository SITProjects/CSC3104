# Coordinator in idlecloud-system, for the AWS control plane. Apply after
# namespaces.yml and coordinator-rbac.yml.
#
# Before applying, create in idlecloud-system:
#   Secret idlecloud-db     key DATABASE_URL  (shared with the autoscaler)
#   Secret idlecloud-minio  keys access-key, secret-key  (the MinIO user that
#                           presigns, e.g. csc3104-local with the readwrite policy)
# MinIO must run on the control plane, listening on its WireGuard IP, with the
# bucket below created.
#
# Moving to real S3 later: set S3_BUCKET to the real bucket, and delete
# S3_PUBLIC_ENDPOINT_URL and both AWS_* variables. boto3 then signs for real S3
# with the control-plane instance role (LabRole), like the autoscaler.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coordinator
  namespace: idlecloud-system
  labels:
    app.kubernetes.io/name: idlecloud-coordinator
spec:
  replicas: 2
  # Both Pods serve the API and schedule; the Lease holder also runs the watcher and housekeeping
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: idlecloud-coordinator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: idlecloud-coordinator
    spec:
      # Its token is mounted for load_incluster_config(); see coordinator-rbac.yml
      serviceAccountName: coordinator
      # Run on the AWS control plane, never on a campus PC that may leave
      nodeSelector:
        idlecloud/role: control
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        # idlecloud-enroll on the hub, so it may use the enrollment helper's socket
        # (infra/enroll/install.sh creates the group with this GID)
        supplementalGroups: [10050]
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: coordinator
          # Versioned, so a rebuilt image is picked up. Bump it on every rebuild.
          image: idlecloud/coordinator:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8001
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: idlecloud-db
                  key: DATABASE_URL
            # Handed to worker Pods, which resolve the Service below through cluster DNS
            - name: COORDINATOR_URL
              value: http://coordinator.idlecloud-system.svc.cluster.local:8001
            # Bucket name only, never a URL
            - name: S3_BUCKET
              value: csc3104-local
            # MinIO as worker Pods reach it: the control plane's WireGuard IP
            # (HUB_WG_IP in services/autoscaler/burst/config.py). Presigned URLs are
            # signed for this host, so it must be exactly what workers use.
            - name: S3_PUBLIC_ENDPOINT_URL
              value: http://10.10.0.1:9000
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: idlecloud-minio
                  key: access-key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: idlecloud-minio
                  key: secret-key
            # MinIO ignores the region, but boto3 needs one to sign
            - name: AWS_DEFAULT_REGION
              value: us-east-1
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: enroll
              mountPath: /run/idlecloud
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        # The enrollment helper's socket (infra/enroll), which adds workers. The
        # helper keeps this folder across restarts, so the mount stays valid.
        - name: enroll
          hostPath:
            path: /run/idlecloud
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: coordinator
  namespace: idlecloud-system
spec:
  selector:
    app.kubernetes.io/name: idlecloud-coordinator
  ports:
    - name: http
      port: 8001
      targetPort: http
