apiVersion: apps/v1
kind: Deployment
metadata:
  name: verifier
  namespace: idlecloud-system
spec:
  template:
    spec:
      containers:
        - name: verifier
          env:
            # Empty means real S3. Not deleted: unset, it defaults to localhost:9000.
            - name: S3_ENDPOINT_URL
              value: ""
            # The same bucket as the coordinator, web and the Lambda
            - name: S3_BUCKET
              value: csc3104-idle-compute
            # Must be the bucket's region
            - name: AWS_DEFAULT_REGION
              value: ap-southeast-1
            # Real S3, signed with the control plane's instance role (LabRole)
            - name: AWS_ACCESS_KEY_ID
              $patch: delete
            - name: AWS_SECRET_ACCESS_KEY
              $patch: delete
