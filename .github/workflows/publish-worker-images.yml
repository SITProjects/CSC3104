name: Publish worker images

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-worker-images.yml
      - .dockerignore
      - worker/ocr-task/Dockerfile
      - worker/ocr-task/main.py
      - worker/runner/runner.py
      - worker/python-job/Dockerfile
      - worker/python-job/requirements.txt
      - worker/pytorch-job/Dockerfile
      - worker/pytorch-job/requirements.txt
      - worker/pytorch-gpu-job/Dockerfile
      - worker/pytorch-gpu-job/requirements.txt
      - worker/pytorch-gpu-job/idlecloud_ckpt.py
      - worker/pytorch-rocm-job/Dockerfile
      - worker/model-check/Dockerfile
      - worker/model-check/requirements.txt
      - worker/model-check/evaluate.py
      - shared/__init__.py
      - shared/checkpoint.py
      - shared/normalized_text.py
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/publish-worker-images.yml
      - .dockerignore
      - worker/ocr-task/Dockerfile
      - worker/ocr-task/main.py
      - worker/runner/runner.py
      - worker/python-job/Dockerfile
      - worker/python-job/requirements.txt
      - worker/pytorch-job/Dockerfile
      - worker/pytorch-job/requirements.txt
      - worker/pytorch-gpu-job/Dockerfile
      - worker/pytorch-gpu-job/requirements.txt
      - worker/pytorch-gpu-job/idlecloud_ckpt.py
      - worker/pytorch-rocm-job/Dockerfile
      - worker/model-check/Dockerfile
      - worker/model-check/requirements.txt
      - worker/model-check/evaluate.py
      - shared/__init__.py
      - shared/checkpoint.py
      - shared/normalized_text.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # PR code gets a build check with no registry login or package write access.
  build-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.large && 90 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ocr
            dockerfile: worker/ocr-task/Dockerfile
          - name: python
            dockerfile: worker/python-job/Dockerfile
          - name: pytorch
            dockerfile: worker/pytorch-job/Dockerfile
          - name: pytorch-gpu
            dockerfile: worker/pytorch-gpu-job/Dockerfile
          # several GB: more disk and time, and no full pull to check access
          - name: pytorch-rocm
            dockerfile: worker/pytorch-rocm-job/Dockerfile
            large: true
          - name: model-check
            dockerfile: worker/model-check/Dockerfile
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Free disk space for a large image
        if: matrix.large
        shell: bash
        run: |
          # the runner's preinstalled SDKs take ~30 GB the ROCm image needs
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.name }} worker
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false

  publish:
    # Manual runs from other branches must not replace the production image.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.large && 90 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ocr
            dockerfile: worker/ocr-task/Dockerfile
          - name: python
            dockerfile: worker/python-job/Dockerfile
          - name: pytorch
            dockerfile: worker/pytorch-job/Dockerfile
          - name: pytorch-gpu
            dockerfile: worker/pytorch-gpu-job/Dockerfile
          # several GB: more disk and time, and no full pull to check access
          - name: pytorch-rocm
            dockerfile: worker/pytorch-rocm-job/Dockerfile
            large: true
          - name: model-check
            dockerfile: worker/model-check/Dockerfile
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Choose image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ matrix.name }}
        shell: bash
        run: echo "name=ghcr.io/${OWNER,,}/idlecloud-${NAME}" >> "$GITHUB_OUTPUT"

      - name: Free disk space for a large image
        if: matrix.large
        shell: bash
        run: |
          # the runner's preinstalled SDKs take ~30 GB the ROCm image needs
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ${{ matrix.name }} worker
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
            ${{ steps.image.outputs.name }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Record published digest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.publish.outputs.digest }}
          NAME: ${{ matrix.name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s@%s\n' "$IMAGE" "$DIGEST" > worker-image.txt
          {
            echo "### $NAME worker image"
            echo
            printf 'Published `%s@%s` for `linux/amd64`.\n' "$IMAGE" "$DIGEST"
            echo
            echo 'The worker-image artifact contains the exact image reference.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save image reference
        uses: actions/upload-artifact@v7
        with:
          name: worker-image-${{ matrix.name }}-${{ github.sha }}
          path: worker-image.txt
          if-no-files-found: error
          retention-days: 30

      - name: Verify workers can pull without credentials
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.publish.outputs.digest }}
          NAME: ${{ matrix.name }}
          LARGE: ${{ matrix.large && 'true' || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          # A fresh Docker config prevents the publishing login from masking a
          # private package. Fresh campus and EC2 workers have no registry keys.
          anonymous_config=$(mktemp -d)
          trap 'rm -rf -- "$anonymous_config"' EXIT
          image_ref="$IMAGE@$DIGEST"
          # a large image is only resolved: the same anonymous access, without
          # downloading several GB again
          if [[ "$LARGE" == true ]]; then
            check=(docker --config "$anonymous_config" manifest inspect "$image_ref")
          else
            check=(docker --config "$anonymous_config" pull --platform linux/amd64 "$image_ref")
          fi
          if ! "${check[@]}" >/dev/null; then
            echo "::error::The $NAME image was published but anonymous pull failed. New GHCR packages are private by default. Open the idlecloud-$NAME package settings, change visibility to Public, and rerun this workflow from main. Also check the pull error above for network or registry failures."
            {
              echo
              echo '**Worker deployment is not ready:** the anonymous pull failed.'
              echo 'For a new package, an owner must change its visibility to Public and rerun this workflow from main.'
              echo 'See https://docs.github.com/en/packages/learn-github-packages/configuring-a-packages-access-control-and-visibility for the package settings.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          {
            echo
            if [[ "$NAME" == pytorch-rocm ]]; then
              echo 'Anonymous access passed. AMD GPU workers pull this image in place of idlecloud-pytorch-gpu with the same tag:'
            elif [[ "$NAME" == ocr ]]; then
              echo 'Anonymous pull passed. On the hub, run `bash services/autoscaler/deploy.sh --no-build` to switch OCR to this image:'
            else
              echo "Anonymous pull passed. The $NAME job type uses the :main tag, so new workers pull this image:"
            fi
            echo
            printf '`%s`\n' "$image_ref"
          } >> "$GITHUB_STEP_SUMMARY"
