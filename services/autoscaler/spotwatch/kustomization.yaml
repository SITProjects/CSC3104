apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - spot-watcher.yml
# Builds the ConfigMap from watcher.py. The name gets a hash of the contents,
# so changing the code rolls the DaemonSet automatically.
configMapGenerator:
  - name: spot-watcher-code
    namespace: idlecloud-system
    files:
      - watcher.py
