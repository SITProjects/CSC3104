<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Idle-Compute Cloud{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body{% if not signed_in %} class="logged-out"{% endif %}>
  {% if signed_in %}
  <aside>
    <a class="brand" href="/">Idle-Compute Cloud</a>
    <nav>
      {% for label, path in nav_items %}
      <a href="{{ path }}">{{ label }}</a>
      {% endfor %}
    </nav>
    <nav class="auth">
      <form class="logout" method="post" action="/logout"><button type="submit" class="link">Log out</button></form>
    </nav>
  </aside>
  {% endif %}
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
