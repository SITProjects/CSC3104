<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Idle-Compute Cloud{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
  <header class="site">
    <a class="brand" href="/">Idle-Compute Cloud</a>
    <nav>
      <a href="/">Upload</a>
      <a href="/history">My jobs</a>
      <a href="/api-keys">API</a>
      <a href="/admin">Admin</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>Campus PCs lend their idle CPU. Every page is OCR'd on {{ REPLICAS_PER_TASK }} machines and checked by majority vote.</footer>
  <script src="{{ url_for('static', path='live.js') }}" defer></script>
</body>
</html>
