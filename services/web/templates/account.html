{% extends "base.html" %}
{% block title %}Account{% endblock %}
{% block content %}
<h1 class="text-2xl font-semibold tracking-tight">Account</h1>
<div class="card mt-6">
  <section>
    <dl class="grid grid-cols-[8rem_1fr] gap-y-3 text-sm">
      <dt class="text-muted-foreground">Email</dt><dd>{{ user.email }}</dd>
      <dt class="text-muted-foreground">Role</dt><dd>{{ "Administrator" if user.role == "ADMIN" else "User" }}</dd>
      <dt class="text-muted-foreground">Member since</dt><dd>{{ joined }}</dd>
    </dl>
  </section>
</div>
{% endblock %}
