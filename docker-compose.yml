services:
  coordinator:
    build:
      context: .
      dockerfile: services/coordinator/Dockerfile
    volumes:
      - ./services/coordinator:/app/coordinator
      - ./shared:/app/shared
      - ./core:/app/core
      - ./kubeconfig:/etc/kube/config:ro
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://admin:password123@postgres:5432/csc3104
      COORDINATOR_URL: http://localhost:8001
      KUBECONFIG: /etc/kube/config
    depends_on:
      postgres:
        condition: service_healthy
      k3-server:
        condition: service_healthy
      minio:
        condition: service_started
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: csc3104
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d csc3104"]
      interval: 5s
      timeout: 5s
      retries: 20
  k3-server:
    image: rancher/k3s:v1.34.1-k3s1
    privileged: true
    command:
      - server # Starts control place, including API and scheduling component
      - --tls-san=k3-server # makes TLS cert valid for hostname k3-server
      - --disable=servicelb # disable bundled load balancer component
      - --disable=traefik # disables bunded HTTP controller
      # control plane only: the server never runs pods, it holds Jobs in Pending until a
      # worker node (lab PC or burst EC2) joins as an agent and the scheduler places them
      - --disable-agent
      - --egress-selector-mode=cluster
    restart: unless-stopped
    tmpfs:
      - /run
      - /var/run
    environment:
      K3S_KUBECONFIG_OUTPUT: /output/config
      K3S_KUBECONFIG_MODE: "644"
    volumes:
      - k3s-data:/var/lib/rancher/k3s
      - k3s-config:/output
    healthcheck:
      test:
        - CMD
        - kubectl # `k3s kubectl` errors in this image; the kubectl symlink works
        - --kubeconfig=/output/config
        - get
        - --raw=/readyz
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  minio:
    image: docker.io/alpine/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    user: "0:0"

  minio-init:
    image: docker.io/clickhouse/minio-mc:RELEASE.2026-09-16T00-00-00Z
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        attempts=0
        until mc alias set local http://minio:9000 admin password123; do
          attempts=$$((attempts + 1))
          if [ "$$attempts" -ge 30 ]; then
            echo "MinIO did not become available"
            exit 1
          fi
          sleep 2
        done
        mc mb --ignore-existing local/csc3104-local
    depends_on:
      minio:
        condition: service_started

volumes:
  postgres-data:
  minio-data:
  k3s-data:
  k3s-config:
